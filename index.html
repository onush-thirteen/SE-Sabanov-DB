<title>Финансовый центр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#eef1f5;
  --page:#f2f4f7;
  --surface:#ffffff;
  --surface-2:#f5f7fa;
  --surface-3:#eaeef3;
  --border:#dde3ea;
  --border-strong:#c9d1db;
  --text:#131a24;
  --text-2:#4e5a68;
  --text-mute:#8b96a3;
  --accent:#1f5c8c;
  --accent-2:#2a78d6;
  --accent-soft:#e2edf7;
  --accent-ink:#ffffff;
  --good:#0a7d2e;
  --good-soft:#e3f5ea;
  --bad:#c62e2e;
  --bad-soft:#fbeaea;
  --warn:#a86a00;
  --warn-soft:#fbf1de;
  --crit:#c62e2e;
  --crit-soft:#fbeaea;
  --shadow:0 1px 2px rgba(18,25,34,.05), 0 8px 24px -12px rgba(18,25,34,.12);
  --shadow-sm:0 1px 2px rgba(18,25,34,.06);
  --cat-1:#2a78d6; --cat-2:#c96a2e; --cat-3:#178f66; --cat-4:#b8860a;
  --cat-5:#b0507f; --cat-6:#3a7d3a; --cat-7:#5b4bb0; --cat-8:#c2483f;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
  --font-ui:'Manrope',system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:'Public Sans',system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0c1015; --page:#0c1015;
    --surface:#141a22; --surface-2:#182029; --surface-3:#1e2731;
    --border:#26303c; --border-strong:#33404e;
    --text:#eef2f6; --text-2:#aab6c4; --text-mute:#71808f;
    --accent:#5aa3e0; --accent-2:#3987e5; --accent-soft:#1a2c3e; --accent-ink:#04131f;
    --good:#3fbf72; --good-soft:#12291d;
    --bad:#e8635c; --bad-soft:#2d1817;
    --warn:#e0aa3d; --warn-soft:#2c2412;
    --crit:#e8635c; --crit-soft:#2d1817;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --cat-1:#3987e5; --cat-2:#e08a4f; --cat-3:#2fb589; --cat-4:#d9a53f;
    --cat-5:#d081a3; --cat-6:#6fbf6f; --cat-7:#9086e0; --cat-8:#e57a72;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0c1015; --page:#0c1015;
  --surface:#141a22; --surface-2:#182029; --surface-3:#1e2731;
  --border:#26303c; --border-strong:#33404e;
  --text:#eef2f6; --text-2:#aab6c4; --text-mute:#71808f;
  --accent:#5aa3e0; --accent-2:#3987e5; --accent-soft:#1a2c3e; --accent-ink:#04131f;
  --good:#3fbf72; --good-soft:#12291d;
  --bad:#e8635c; --bad-soft:#2d1817;
  --warn:#e0aa3d; --warn-soft:#2c2412;
  --crit:#e8635c; --crit-soft:#2d1817;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --cat-1:#3987e5; --cat-2:#e08a4f; --cat-3:#2fb589; --cat-4:#d9a53f;
  --cat-5:#d081a3; --cat-6:#6fbf6f; --cat-7:#9086e0; --cat-8:#e57a72;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--page);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4,.ui{font-family:var(--font-ui);}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
a{color:var(--accent);}
::selection{background:var(--accent-soft);}
.hidden{display:none!important;}

#app{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:250px;flex:0 0 250px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;}
.brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(155deg,var(--accent-2),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-ui);font-weight:800;font-size:15px;flex:none;}
.brand-text{font-family:var(--font-ui);font-weight:800;font-size:15px;letter-spacing:.1px;}
.brand-sub{font-size:11px;color:var(--text-mute);margin-top:1px;}
.nav{padding:6px 10px 16px;flex:1;}
.nav-group{margin-top:14px;}
.nav-group:first-child{margin-top:2px;}
.nav-group-title{font-family:var(--font-ui);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-mute);padding:0 10px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-2);font-size:13.5px;font-weight:600;margin-bottom:2px;border:1px solid transparent;user-select:none;}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--accent);}
.nav-item .ic{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;}
.nav-item .ic svg{width:17px;height:17px;}
.sidebar-foot{padding:12px;border-top:1px solid var(--border);}

/* ---------- Topbar / KPIs ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:20;background:var(--page);padding:16px 26px 0;}
.topbar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.hamburger{display:none;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);align-items:center;justify-content:center;cursor:pointer;flex:none;}
.page-title{font-family:var(--font-ui);font-weight:800;font-size:20px;flex:1;}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);flex:none;}
.icon-btn:hover{color:var(--text);border-color:var(--border-strong);}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;box-shadow:var(--shadow-sm);}
.kpi-label{font-size:11.5px;color:var(--text-mute);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.kpi-value{font-family:var(--font-num);font-weight:600;font-size:22px;letter-spacing:-.2px;}
.kpi-sub{font-size:12px;color:var(--text-mute);margin-top:4px;}
.kpi-sub.good{color:var(--good);} .kpi-sub.bad{color:var(--bad);}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;font-family:var(--font-ui);}
.pill.good{background:var(--good-soft);color:var(--good);}
.pill.warn{background:var(--warn-soft);color:var(--warn);}
.pill.crit{background:var(--crit-soft);color:var(--crit);}
.pill.neutral{background:var(--surface-3);color:var(--text-2);}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

.content{padding:4px 26px 40px;flex:1;}
.banner{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border:1px solid var(--accent);border-color:color-mix(in srgb, var(--accent) 35%, transparent);color:var(--text);border-radius:var(--radius-md);padding:10px 14px;margin-bottom:16px;font-size:13px;}
.banner button{margin-left:auto;}

/* ---------- Cards / sections ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:18px 20px;margin-bottom:16px;}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.card-title{font-family:var(--font-ui);font-weight:700;font-size:15px;flex:1;}
.card-desc{font-size:12.5px;color:var(--text-mute);margin-top:-8px;margin-bottom:14px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:1050px){.grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-2,.grid-3{grid-template-columns:1fr;}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:700;font-family:var(--font-ui);font-size:13px;cursor:pointer;white-space:nowrap;}
.btn:hover{border-color:var(--text-mute);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn.primary:hover{filter:brightness(1.08);}
.btn.ghost{border-color:transparent;background:transparent;}
.btn.ghost:hover{background:var(--surface-2);}
.btn.danger{color:var(--bad);border-color:transparent;background:transparent;}
.btn.danger:hover{background:var(--bad-soft);}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.icon-only{padding:6px;}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-family:var(--font-ui);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-mute);font-weight:700;padding:0 10px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
td.num,th.num{font-family:var(--font-num);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
tbody tr:hover{background:var(--surface-2);}
.row-actions{display:flex;gap:4px;justify-content:flex-end;}
.muted{color:var(--text-mute);}
.text-good{color:var(--good);} .text-bad{color:var(--bad);} .text-warn{color:var(--warn);}
.empty{padding:32px 12px;text-align:center;color:var(--text-mute);font-size:13px;}
.empty svg{opacity:.5;margin-bottom:8px;}

/* ---------- Forms ---------- */
label.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
label.field span{font-size:12px;font-weight:600;color:var(--text-2);}
input[type=text],input[type=number],input[type=date],select,textarea{
  border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);
  border-radius:8px;padding:8px 10px;font-size:13.5px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-2);outline-offset:0;border-color:var(--accent-2);}
.checkline{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.checkline input{width:16px;height:16px;}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* ---------- Modal ---------- */
#modalRoot{position:fixed;inset:0;z-index:100;display:none;}
#modalRoot.open{display:block;}
.modal-backdrop{position:absolute;inset:0;background:rgba(10,14,20,.5);backdrop-filter:blur(1px);}
.modal-card{position:relative;max-width:480px;margin:6vh auto 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);max-height:88vh;display:flex;flex-direction:column;}
.modal-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);}
.modal-title{font-family:var(--font-ui);font-weight:800;font-size:16px;flex:1;}
.modal-body{padding:16px 18px;overflow-y:auto;}
.modal-foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}

/* ---------- Progress ---------- */
.meter{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;}
.meter>span{display:block;height:100%;border-radius:99px;background:var(--accent-2);}
.meter.good>span{background:var(--good);}
.meter.warn>span{background:var(--warn);}
.meter.crit>span{background:var(--bad);}
.bar-compare{display:flex;flex-direction:column;gap:4px;}
.bar-track{position:relative;height:16px;background:var(--surface-3);border-radius:5px;overflow:hidden;}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;}
.bar-fill.plan{background:var(--text-mute);opacity:.35;}
.bar-fill.fact{background:var(--accent-2);}
.bar-fill.over{background:var(--bad);}

/* ---------- Goal / saving cards ---------- */
.goal-card{border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;background:var(--surface-2);}
.goal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;}
.goal-name{font-weight:700;font-family:var(--font-ui);font-size:14px;}
.goal-meta{font-size:11.5px;color:var(--text-mute);margin-top:2px;}
.goal-nums{display:flex;justify-content:space-between;font-family:var(--font-num);font-size:12.5px;margin:8px 0 6px;}

/* ---------- Chart ---------- */
.chart-wrap{width:100%;position:relative;}
.chart-tooltip{position:absolute;pointer-events:none;background:var(--text);color:var(--page);font-family:var(--font-num);font-size:11.5px;padding:5px 8px;border-radius:6px;transform:translate(-50%,-115%);white-space:nowrap;box-shadow:var(--shadow-sm);opacity:0;transition:opacity .08s;z-index:5;}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;font-size:12px;color:var(--text-2);}
.chart-legend span.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle;}

/* ---------- AI recs ---------- */
.rec{display:flex;gap:12px;padding:14px;border-radius:var(--radius-md);border:1px solid var(--border);margin-bottom:10px;background:var(--surface-2);}
.rec .ic{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;}
.rec.crit .ic{background:var(--crit-soft);color:var(--crit);}
.rec.warn .ic{background:var(--warn-soft);color:var(--warn);}
.rec.good .ic{background:var(--good-soft);color:var(--good);}
.rec.info .ic{background:var(--accent-soft);color:var(--accent);}
.rec-title{font-weight:700;font-size:13.5px;margin-bottom:3px;}
.rec-text{font-size:12.5px;color:var(--text-2);}

.section-tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--border);}
.section-tab{padding:8px 4px;font-size:13px;font-weight:700;font-family:var(--font-ui);color:var(--text-mute);cursor:pointer;border-bottom:2px solid transparent;margin-right:14px;}
.section-tab.active{color:var(--accent);border-color:var(--accent);}

.overlay{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:29;display:none;}
.overlay.show{display:block;}

@media(max-width:880px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:30;transform:translateX(-100%);transition:transform .18s ease;box-shadow:var(--shadow);}
  .sidebar.open{transform:translateX(0);}
  .hamburger{display:flex;}
  .kpi-row{grid-template-columns:1fr;}
  .topbar{padding:14px 14px 0;}
  .content{padding:4px 14px 40px;}
  .grid-2{grid-template-columns:1fr;}
  .form-row2{grid-template-columns:1fr;}
}
</style>

<div id="app">
  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">₸</div>
      <div>
        <div class="brand-text">Финансовый центр</div>
        <div class="brand-sub">личные финансы</div>
      </div>
    </div>
    <nav class="nav" id="navRoot"></nav>
    <div class="sidebar-foot">
      <button class="btn ghost" id="settingsBtn" style="width:100%;justify-content:flex-start;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>
        Настройки
      </button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="topbar-row">
        <button class="hamburger" id="hamburgerBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="page-title" id="pageTitle">Обзор</div>
        <button class="icon-btn" id="themeBtn" title="Тема"></button>
      </div>
      <div class="kpi-row" id="kpiRow"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="modalRoot">
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal-card" id="modalCard"></div>
</div>

<script>

function fromISO(s){ var p=(s||'').split('-'); if(p.length<3) return todayD(); return new Date(+p[0],+p[1]-1,+p[2]); }
function addMonths(d,n){ var r=new Date(d); r.setMonth(r.getMonth()+n); return r; }

function fmtDateShort(d){ if(typeof d==='string') d=fromISO(d); return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear(); }
function diffMonths(a,b){ return (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()) + (b.getDate()>=a.getDate()?0:-1); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

function fmtMoney(n, opts){
  opts = opts||{};
  n = Math.round(n||0);

  var abs = Math.abs(n);
  return sign + abs.toLocaleString('ru-RU') + ' ' + DB.settings.currency;
}
function fmtNum(n){ return Math.round(n||0).toLocaleString('ru-RU'); }
function fmtPct(n,d){ d = d==null?1:d; return (n||0).toFixed(d).replace('.',',')+'%'; }

/* ============================== FINANCE ENGINE ============================== */
function annuityPayment(principal, annualRatePct, termMonths){
  var r = annualRatePct/100/12;
  if(termMonths<=0) return principal;
  if(r===0) return principal/termMonths;
  var f = Math.pow(1+r, termMonths);
  return principal * r * f / (f-1);
}
function loanPayment(loan){ return annuityPayment(loan.principal, loan.annualRate, loan.termMonths); }
function loanSchedule(loan){
  var rows=[]; var balance=loan.principal; var r=loan.annualRate/100/12;
  var payment=loanPayment(loan); var start=fromISO(loan.startDate);
  for(var i=1;i<=loan.termMonths;i++){
    var interest = balance*r;
    var principalPart = Math.min(balance, payment-interest);
    balance = Math.max(0, balance-principalPart);
    rows.push({n:i, date:addMonths(start,i), payment:principalPart+interest, interest:interest, principalPart:principalPart, balance:balance});
  }
  return rows;
}
function loanElapsed(loan){ return clamp(diffMonths(fromISO(loan.startDate), todayD()), 0, loan.termMonths); }
function loanRemaining(loan){
  var elapsed = loanElapsed(loan);
  if(elapsed<=0) return loan.principal;
  if(elapsed>=loan.termMonths) return 0;
  var sched = loanSchedule(loan);
  return sched[elapsed-1].balance;
}
function loanActive(loan){ return loanElapsed(loan) < loan.termMonths; }

function depositCalc(dep, asOf){
  asOf = asOf || todayD();
  var start = fromISO(dep.startDate);
  var elapsed = clamp(diffMonths(start, asOf), 0, dep.termMonths);
  var r = dep.annualRate/100/12;
  var value;
  if(dep.capitalization){ value = dep.amount * Math.pow(1+r, elapsed); }
  else { value = dep.amount + dep.amount*r*elapsed; }
  return {value:value, income:value-dep.amount, elapsed:elapsed, maturity:addMonths(start,dep.termMonths)};
}

function totalAccountBalance(){ return DB.accounts.reduce(function(s,a){return s+a.balance;},0); }
function totalDepositsValue(){ return DB.deposits.reduce(function(s,d){return s+depositCalc(d).value;},0); }
function totalSavingsValue(){ return DB.savings.reduce(function(s,g){return s+g.current;},0); }
function totalAssetsValue(){ return DB.assets.reduce(function(s,a){return s+a.value;},0); }
function totalLoansRemaining(){ return DB.loans.reduce(function(s,l){return s+loanRemaining(l);},0); }
function totalActiveLoanPayments(){ return DB.loans.filter(loanActive).reduce(function(s,l){return s+loanPayment(l);},0); }

function netWorth(){
  return totalAccountBalance()+totalDepositsValue()+totalSavingsValue()+totalAssetsValue()-totalLoansRemaining();
}
function ensureSnapshot(){
  var key = monthKey(todayD());
  var exists = DB.netWorthHistory.some(function(p){return p.key===key;});
  if(!exists){ DB.netWorthHistory.push({key:key, date:toISO(todayD()), value:netWorth()}); }
  else {
    DB.netWorthHistory = DB.netWorthHistory.map(function(p){ return p.key===key ? {key:key,date:p.date,value:netWorth()} : p; });
  }
  DB.netWorthHistory.sort(function(a,b){return a.key<b.key?-1:1;});
}

function monthsWithData(type, count){
  var byMonth={};
  DB.transactions.forEach(function(t){
    if(t.type!==type) return;
    var mk = monthKey(fromISO(t.date));
    byMonth[mk]=(byMonth[mk]||0)+t.amount;
  });
  var keys=Object.keys(byMonth).sort();
  var curKey = monthKey(todayD());
  keys = keys.filter(function(k){return k!==curKey;});
  keys = keys.slice(-count);
  if(keys.length===0) return null;
  var sum=keys.reduce(function(s,k){return s+byMonth[k];},0);
  return sum/keys.length;
}
function avgMonthlyIncome(){
  if(DB.settings.manualMonthlyIncome>0) return DB.settings.manualMonthlyIncome;
  var v = monthsWithData('income',3);
  if(v!=null) return v;
  return Object.keys(DB.budget).filter(function(k){return budgetKind(k)==='income';}).reduce(function(s,k){return s+DB.budget[k];},0);
}
function avgMonthlyExpense(){
  var v = monthsWithData('expense',3);
  if(v!=null) return v;
  return Object.keys(DB.budget).filter(function(k){return budgetKind(k)==='expense';}).reduce(function(s,k){return s+DB.budget[k];},0);
}

function debtLoad(){
  var income = avgMonthlyIncome();
  var payments = totalActiveLoanPayments();
  var pct = income>0 ? (payments/income*100) : (payments>0?999:0);
  var level = pct<=30?'good':(pct<=50?'warn':'crit');
  return {pct:pct, level:level, payments:payments, income:income};
}

function forecastSeries(months){
  months = months||6;
  var pts=[]; var balance = totalAccountBalance();
  var income = avgMonthlyIncome(); var expense = avgMonthlyExpense();
  var today = todayD();
  pts.push({label:'Сейчас', date:today, value:balance});
  for(var i=1;i<=months;i++){
    var monthDate = addMonths(today,i);
    var loanPay = DB.loans.reduce(function(s,l){
      var elapsedAtM = clamp(diffMonths(fromISO(l.startDate), monthDate),0,l.termMonths);
      return s + (elapsedAtM>0 && elapsedAtM<=l.termMonths && diffMonths(fromISO(l.startDate),monthDate)>=1 && diffMonths(fromISO(l.startDate),monthDate)<=l.termMonths ? loanPayment(l) : 0);
    },0);
    balance = balance + income - expense - loanPay;
    pts.push({label:MONTHS_SHORT[monthDate.getMonth()]+' '+String(monthDate.getFullYear()).slice(2), date:monthDate, value:balance});
  }
  return pts;
}

function categoryActuals(type, monthDate){
  var mk = monthKey(monthDate);
  var out={};
  DB.transactions.forEach(function(t){
    if(t.type!==type) return;
    if(monthKey(fromISO(t.date))!==mk) return;
    out[t.category]=(out[t.category]||0)+t.amount;
  });
  return out;
}

function recommendations(){
  var recs=[];
  var dl = debtLoad();
  if(dl.level==='crit'){
    recs.push({level:'crit',title:'Критическая долговая нагрузка',text:'Платежи по кредитам съедают '+fmtPct(dl.pct,0)+' дохода — выше безопасной нормы (30%). Рассмотрите рефинансирование, продажу непрофильных активов или досрочное погашение части долга.'});
  } else if(dl.level==='warn'){
    recs.push({level:'warn',title:'Повышенная долговая нагрузка',text:'Кредитные платежи занимают '+fmtPct(dl.pct,0)+' дохода. Постарайтесь не брать новых кредитов и направляйте свободные средства на погашение долга.'});
  } else if(dl.payments>0){
    recs.push({level:'good',title:'Долговая нагрузка в норме',text:'Платежи по кредитам — '+fmtPct(dl.pct,0)+' дохода, это в пределах безопасной нормы.'});
  }

  var income = avgMonthlyIncome(), expense = avgMonthlyExpense();
  var free = income - expense - totalActiveLoanPayments();
  var liquid = totalAccountBalance();
  var reserve = liquid + totalSavingsValue();
  var reserveMonths = expense>0 ? reserve/expense : 0;
  if(reserveMonths<3){
    recs.push({level:'warn',title:'Финансовая подушка ниже нормы',text:'Ваш резерв (счета + накопления) покрывает всего '+fmtPct(reserveMonths,1).replace('%','')+' мес. расходов. Рекомендуемый минимум — 3–6 месяцев ('+fmtMoney(expense*3)+'–'+fmtMoney(expense*6)+').'});
  } else {
    recs.push({level:'good',title:'Финансовая подушка достаточна',text:'Резерв покрывает '+reserveMonths.toFixed(1).replace('.',',')+' мес. расходов — это в пределах рекомендуемой нормы.'});
  }

  if(free>0){
    recs.push({level:'info',title:'Есть свободные средства',text:'После расходов и платежей остаётся ок. '+fmtMoney(free)+' в месяц. Направьте их на цели с ближайшим сроком или на пополнение депозита.'});
  } else if(free<0){
    recs.push({level:'crit',title:'Расходы превышают доходы',text:'При текущем темпе трат дефицит бюджета — ок. '+fmtMoney(Math.abs(free))+' в месяц. Проверьте раздел «План-факт», чтобы найти категории с перерасходом.'});
  }

  DB.deposits.forEach(function(d){
    if(d.annualRate < ASSUMED_INFLATION){
      recs.push({level:'warn',title:'Ставка по вкладу «'+d.name+'» ниже инфляции',text:'Ставка '+fmtPct(d.annualRate,1)+' ниже ориентировочной инфляции ('+fmtPct(ASSUMED_INFLATION,1)+') — реальная стоимость сбережений может снижаться.'});
    }
  });

  var mf = monthKey(todayD());
  var expenseActual = categoryActuals('expense', todayD());
  Object.keys(DB.budget).forEach(function(cat){
    if(budgetKind(cat)!=='expense') return;
    var plan = DB.budget[cat]; var fact = expenseActual[cat]||0;
    if(plan>0 && fact > plan*1.2){
      recs.push({level:'warn',title:'Перерасход по категории «'+cat+'»',text:'Факт '+fmtMoney(fact)+' против плана '+fmtMoney(plan)+' ('+fmtPct((fact/plan-1)*100,0)+' сверх плана) в этом месяце.'});
    }
  });

  DB.savings.forEach(function(g){
    var left = g.target-g.current; if(left<=0) return;
    var monthsLeft = Math.max(1, diffMonths(todayD(), fromISO(g.deadline)));
    var need = left/monthsLeft;
    if(need > free && free>0){
      recs.push({level:'warn',title:'Цель «'+g.name+'» может не успеть к сроку',text:'Нужно откладывать '+fmtMoney(need)+'/мес., это больше текущих свободных средств ('+fmtMoney(free)+'). Рассмотрите сдвиг срока или уменьшение цели.'});
    }
  });

  if(DB.netWorthHistory.length>=2){
    var last = DB.netWorthHistory[DB.netWorthHistory.length-1].value;
    var prev = DB.netWorthHistory[DB.netWorthHistory.length-2].value;
    if(last<prev){
      recs.push({level:'warn',title:'Чистый капитал снижается',text:'За последний период чистый капитал уменьшился на '+fmtMoney(prev-last)+'. Проверьте рост долга и темп трат накоплений.'});
    }
  }
  var order={crit:0,warn:1,info:2,good:3};
  recs.sort(function(a,b){return order[a.level]-order[b.level];});
  return recs;
}

/* ============================== CHART: line ============================== */
var chartSeq=0;
function renderLineChart(container, points, opt){
  opt = opt||{};
  var id = 'lc'+(chartSeq++);
  var W=680,H=opt.height||220, padL=64,padR=16,padT=16,padB=30;
  var vals = points.map(function(p){return p.value;});
  var minV = Math.min.apply(null, vals.concat([0])), maxV = Math.max.apply(null, vals);
  if(maxV===minV){ maxV = minV+1; }
  var span = maxV-minV; maxV += span*0.08; minV -= span*0.08;
  var innerW = W-padL-padR, innerH = H-padT-padB;
  function xAt(i){ return padL + (points.length<=1?0:i/(points.length-1))*innerW; }
  function yAt(v){ return padT + innerH - ((v-minV)/(maxV-minV))*innerH; }
  var todayIdx = opt.todayIndex!=null?opt.todayIndex:-1;

  var gridN=4, gridLines='', gridLabels='';
  for(var g=0; g<=gridN; g++){
    var v = minV + (maxV-minV)*g/gridN;
    var y = yAt(v);
    gridLines += '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/>';
    gridLabels += '<text x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="10.5" fill="var(--text-mute)" font-family="var(--font-num)">'+shortMoney(v)+'</text>';
  }
  var xLabels='';
  points.forEach(function(p,i){
    if(points.length>10 && i%Math.ceil(points.length/8)!==0 && i!==points.length-1) return;
    xLabels += '<text x="'+xAt(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10.5" fill="var(--text-mute)" font-family="var(--font-num)">'+esc(p.label)+'</text>';
  });
  var path = points.map(function(p,i){ return (i===0?'M':'L')+xAt(i).toFixed(1)+','+yAt(p.value).toFixed(1); }).join(' ');
  var areaPath = path + ' L'+xAt(points.length-1).toFixed(1)+','+(padT+innerH)+' L'+xAt(0)+','+(padT+innerH)+' Z';
  var zeroY = yAt(0);
  var dots = points.map(function(p,i){
    var isEnd = i===points.length-1;
    return '<circle class="pt" data-i="'+i+'" cx="'+xAt(i).toFixed(1)+'" cy="'+yAt(p.value).toFixed(1)+'" r="'+(isEnd?4.5:3)+'" fill="'+(isEnd?'var(--accent)':'var(--surface)')+'" stroke="var(--accent)" stroke-width="2"/>';
  }).join('');
  var hoverLine = '<line id="'+id+'hv" x1="0" y1="'+padT+'" x2="0" y2="'+(padT+innerH)+'" stroke="var(--text-mute)" stroke-width="1" stroke-dasharray="3,3" opacity="0"/>';

  container.innerHTML =
    '<div class="chart-wrap">'+
    '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;overflow:visible;" id="'+id+'">'+
      '<defs><linearGradient id="'+id+'g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent-2)" stop-opacity="0.22"/><stop offset="100%" stop-color="var(--accent-2)" stop-opacity="0"/></linearGradient></defs>'+
      gridLines+
      (minV<0 && maxV>0 ? '<line x1="'+padL+'" y1="'+zeroY+'" x2="'+(W-padR)+'" y2="'+zeroY+'" stroke="var(--border-strong)" stroke-width="1.2"/>' : '')+
      '<path d="'+areaPath+'" fill="url(#'+id+'g)" stroke="none"/>'+
      '<path d="'+path+'" fill="none" stroke="var(--accent-2)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>'+
      dots + hoverLine + gridLabels + xLabels +
    '</svg>'+
    '<div class="chart-tooltip" id="'+id+'tt"></div>'+
    '</div>';

  var svg = document.getElementById(id), tt = document.getElementById(id+'tt'), hv=document.getElementById(id+'hv');
  function showTip(i, clientEvt){
    var p = points[i]; if(!p) return;
    var rect = svg.getBoundingClientRect();
    var xPix = (xAt(i)/W)*rect.width;
    tt.style.left = xPix+'px'; tt.style.top = ((yAt(p.value)/H)*rect.height)+'px';
    tt.style.opacity=1;
    tt.textContent = p.label+': '+fmtMoney(p.value);
    hv.setAttribute('x1', xAt(i)); hv.setAttribute('x2', xAt(i)); hv.setAttribute('opacity',1);
  }
  function hideTip(){ tt.style.opacity=0; hv.setAttribute('opacity',0); }
  svg.addEventListener('mousemove', function(e){
    var rect = svg.getBoundingClientRect();
    var relX = (e.clientX-rect.left)/rect.width*W;
    var idx = Math.round((relX-padL)/innerW*(points.length-1));
    idx = clamp(idx,0,points.length-1);
    showTip(idx);
  });
  svg.addEventListener('mouseleave', hideTip);
  svg.addEventListener('touchstart', function(e){
    var t=e.touches[0]; var rect=svg.getBoundingClientRect();
    var relX=(t.clientX-rect.left)/rect.width*W;
    var idx=clamp(Math.round((relX-padL)/innerW*(points.length-1)),0,points.length-1);
    showTip(idx);
  }, {passive:true});
}
function shortMoney(v){
  var av=Math.abs(v);
  if(av>=1000000) return (v/1000000).toFixed(v%1000000===0?0:1).replace('.',',')+'M';
  if(av>=1000) return Math.round(v/1000)+'K';
  return String(Math.round(v));
}

/* ---- Plan-fact ---- */
var pfMonthOffset = 0;
function renderPlanFact(c){
  var monthDate = addMonths(todayD(), pfMonthOffset);
  var actualExp = categoryActuals('expense', monthDate);
  var actualInc = categoryActuals('income', monthDate);
  var cats = Object.keys(DB.budget);
  var rows = cats.map(function(k){
    var isIncome = budgetKind(k)==='income';
    var plan = DB.budget[k];
    var fact = isIncome ? (actualInc[k]||0) : (actualExp[k]||0);
    var dev = fact-plan;
    var devPct = plan>0 ? dev/plan*100 : (fact>0?100:0);
    var bad = isIncome ? dev<0 : dev>0;
    var maxV = Math.max(plan,fact,1);
    return {k:k, isIncome:isIncome, plan:plan, fact:fact, dev:dev, devPct:devPct, bad:bad, maxV:maxV};
  });
  var totalPlan = rows.reduce(function(s,r){return s+(r.isIncome?r.plan:-r.plan);},0);
  var totalFact = rows.reduce(function(s,r){return s+(r.isIncome?r.fact:-r.fact);},0);

  var tableRows = rows.map(function(r){
    return '<tr><td>'+esc(r.k)+'<span class="muted" style="font-size:11px;"> · '+(r.isIncome?'доход':'расход')+'</span></td>'+
      '<td class="num muted">'+fmtMoney(r.plan)+'</td><td class="num">'+fmtMoney(r.fact)+'</td>'+
      '<td class="num '+(r.bad?'text-bad':'text-good')+'">'+(r.dev>=0?'+':'')+fmtNum(r.dev)+'</td>'+
      '<td style="min-width:140px;"><div class="bar-track">'+
        '<div class="bar-fill plan" style="width:'+(r.plan/r.maxV*100)+'%"></div>'+
        '<div class="bar-fill '+(r.bad?'over':'fact')+'" style="width:'+(r.fact/r.maxV*100)+'%;opacity:.85;"></div>'+
      '</div></td></tr>';
  }).join('');

  c.innerHTML = demoBanner()+
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">'+
      '<button class="btn sm ghost" id="pfPrev">← </button>'+
      '<div class="ui" style="font-weight:700;">'+MONTHS_RU[monthDate.getMonth()]+' '+monthDate.getFullYear()+'</div>'+

        '<div style="margin-top:10px;font-weight:700;" class="num">Итого активов: '+fmtMoney(assetsTotal)+'</div>')+
      sectionCard('Обязательства','', '<div class="kpi-value num text-bad">'+fmtMoney(debt)+'</div><div class="muted" style="font-size:12px;margin-top:4px;">остаток по всем кредитам</div>')+
    '</div>'+
    sectionCard('Имущество (прочие активы)','', '<div style="margin-bottom:12px;"><button class="btn primary sm" id="addAssetBtn">+ Добавить имущество</button></div>'+
      '<div class="table-wrap"><table>'+(assetRows?'<thead><tr><th>Название</th><th class="num">Стоимость</th><th></th></tr></thead><tbody>'+assetRows+'</tbody>':'')+'</table></div>'+
      (assetRows?'':emptyState('Имущество не добавлено')));

  Array.prototype.forEach.call(c.querySelectorAll('[data-del-asset]'), function(el){ el.addEventListener('click', function(){
    if(!confirm('Удалить?')) return;
    DB.assets = DB.assets.filter(function(a){return a.id!==el.getAttribute('data-del-asset');});

function openAssetModal(id){
  var a = id ? DB.assets.find(function(x){return x.id===id;}) : null;
  formModal({
    title:a?'Изменить имущество':'Новое имущество',
    initial:a||{},
    fields:[{key:'name',label:'Название',type:'text'},{key:'value',label:'Оценочная стоимость',type:'number',step:'0.01'}],
    onDelete: a? function(){ DB.assets=DB.assets.filter(function(x){return x.id!==id;}); ensureSnapshot(); save(); goTo('networth'); } : null,
    onSave:function(v){
      if(a){ Object.assign(a,v); } else { v.id=uid(); DB.assets.push(v); }
      ensureSnapshot(); save(); goTo('networth');
    }
  });
}

/* ---- Annual plan ---- */
function renderAnnual(c){
  var months = [];
  for(var i=0;i<12;i++) months.push(addMonths(todayD(), i));
  var incomeCats = Object.keys(DB.budget).filter(function(k){return budgetKind(k)==='income';});
  var expenseCats = Object.keys(DB.budget).filter(function(k){return budgetKind(k)==='expense';});
  var planIncome = incomeCats.reduce(function(s,k){return s+DB.budget[k];},0);
  var planExpense = expenseCats.reduce(function(s,k){return s+DB.budget[k];},0);

  var goalMonthly = {};
  DB.savings.concat(DB.goals).forEach(function(g){
    var monthsLeft = Math.max(1, diffMonths(todayD(), fromISO(g.deadline)));
    var left = Math.max(0, (g.target!=null?g.target:g.amount)-g.current);
    goalMonthly[g.name] = left/monthsLeft;
  });
  var totalGoalMonthly = Object.values(goalMonthly).reduce(function(s,v){return s+v;},0);

  var balance = totalAccountBalance();
  var rows = months.map(function(md,i){
    var loanPay = DB.loans.reduce(function(s,l){
      var elapsedAtM = diffMonths(fromISO(l.startDate), md);
      return s + (elapsedAtM>=1 && elapsedAtM<=l.termMonths ? loanPayment(l) : 0);
    },0);
    var net = planIncome - planExpense - loanPay - totalGoalMonthly;
    balance += net;
    return {md:md, income:planIncome, expense:planExpense+loanPay, goals:totalGoalMonthly, net:net, balance:balance};
  });

  c.innerHTML = demoBanner()+
    sectionCard('Годовой финансовый план','Помесячная раскладка на основе текущего бюджета, платежей по кредитам и вкладов в цели',
      '<div class="table-wrap"><table><thead><tr><th>Месяц</th><th class="num">Доход</th><th class="num">Расходы + кредиты</th><th class="num">Взносы в цели</th><th class="num">Итог</th><th class="num">Баланс на конец мес.</th></tr></thead><tbody>'+
      rows.map(function(r){
        return '<tr><td>'+MONTHS_RU[r.md.getMonth()]+' '+r.md.getFullYear()+'</td>'+
          '<td class="num text-good">'+fmtMoney(r.income)+'</td>'+
          '<td class="num text-bad">'+fmtMoney(r.expense)+'</td>'+
          '<td class="num muted">'+fmtMoney(r.goals)+'</td>'+
          '<td class="num '+(r.net>=0?'text-good':'text-bad')+'">'+(r.net>=0?'+':'')+fmtNum(r.net)+'</td>'+
          '<td class="num" style="font-weight:600;">'+fmtMoney(r.balance)+'</td></tr>';
      }).join('')+
      '</tbody></table></div>')+
    sectionCard('Помесячные взносы по целям и копилкам','', Object.keys(goalMonthly).length ? Object.keys(goalMonthly).map(function(k){
      return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;"><span>'+esc(k)+'</span><span class="num">'+fmtMoney(goalMonthly[k])+'/мес.</span></div>';
    }).join('') : emptyState('Нет активных целей'));
  wireDemoBanner();
}

/* ============================== SETTINGS MODAL ============================== */
function openSettings(){
  var html = '<label class="field"><span>Валюта</span><select id="setCurrency">'+
    CURRENCIES.map(function(cc){return '<option value="'+cc+'"'+(DB.settings.currency===cc?' selected':'')+'>'+cc+'</option>';}).join('')+
    '</select></label>'+
    '<label class="field"><span>Тема оформления</span><select id="setTheme">'+
    '<option value="system">Системная</option><option value="light">Светлая</option><option value="dark">Тёмная</option>'+
    '</select></label>'+
    '<div style="height:6px;"></div>'+
    '<div class="card-desc" style="margin-bottom:8px;">Резервная копия данных (текстом, для переноса на другое устройство)</div>'+
    '<textarea id="exportArea" rows="5" readonly style="font-family:var(--font-num);font-size:11px;"></textarea>'+
    '<div style="display:flex;gap:8px;margin-top:8px;"><button class="btn sm" id="copyExportBtn">Скопировать</button>'+
    '<button class="btn sm" id="importBtn">Импортировать из буфера</button></div>';
  var foot = '<div style="flex:1"></div><button class="btn ghost" id="setClose">Закрыть</button>';
  openModal('Настройки', html, foot);
  document.getElementById('exportArea').value = JSON.stringify(DB);
  document.getElementById('setCurrency').value = DB.settings.currency;
  document.getElementById('setTheme').value = localStorage.getItem(LS_THEME_KEY) || 'system';
  document.getElementById('setClose').addEventListener('click', closeModal);
  document.getElementById('setCurrency').addEventListener('change', function(e){ DB.settings.currency=e.target.value; save(); goTo(CUR_VIEW); document.getElementById('exportArea').value = JSON.stringify(DB); });
  document.getElementById('setTheme').addEventListener('change', function(e){ applyTheme(e.target.value); });
  document.getElementById('copyExportBtn').addEventListener('click', function(){
    var ta = document.getElementById('exportArea'); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    if(navigator.clipboard){ navigator.clipboard.writeText(ta.value).catch(function(){}); }
  });
  document.getElementById('importBtn').addEventListener('click', function(){
    if(navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText().then(function(text){ tryImport(text); }).catch(function(){
        var text = prompt('Вставьте скопированные данные:'); if(text) tryImport(text);
      });
    } else {
      var text = prompt('Вставьте скопированные данные:'); if(text) tryImport(text);
    }
  });
}
function tryImport(text){
  try{
    var data = JSON.parse(text);
    if(!data || !data.settings) throw new Error('bad');
    DB = data; ensureSnapshot(); save(); closeModal(); goTo('overview');
  }catch(e){ alert('Не удалось прочитать данные — проверьте формат.'); }
}

/* ============================== THEME ============================== */
function applyTheme(mode){
  localStorage.setItem(LS_THEME_KEY, mode);
  if(mode==='system'){ document.documentElement.removeAttribute('data-theme'); }
  else { document.documentElement.setAttribute('data-theme', mode); }
  updateThemeBtn();
}
function currentEffectiveDark(){
  var explicit = document.documentElement.getAttribute('data-theme');
  if(explicit) return explicit==='dark';
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function updateThemeBtn(){
  var mode = localStorage.getItem(LS_THEME_KEY)||'system';
  var btn = document.getElementById('themeBtn');
  btn.innerHTML = mode==='dark'?ICONS.moon:mode==='light'?ICONS.sun:ICONS.auto;
  btn.title = mode==='dark'?'Тёмная тема':mode==='light'?'Светлая тема':'Системная тема (нажмите, чтобы изменить)';
}

/* ============================== INIT ============================== */
function closeSidebarMobile(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
function init(){
  load();
  var savedTheme = localStorage.getItem(LS_THEME_KEY)||'system';
  applyTheme(savedTheme);
  renderNav();
  goTo('overview');
  document.getElementById('settingsBtn').addEventListener('click', openSettings);
  document.getElementById('themeBtn').addEventListener('click', function(){
    var cur = localStorage.getItem(LS_THEME_KEY)||'system';
    var next = cur==='system'?'light':cur==='light'?'dark':'system';
    applyTheme(next);
  });
  document.getElementById('hamburgerBtn').addEventListener('click', function(){
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('overlay').classList.add('show');
  });
  document.getElementById('overlay').addEventListener('click', closeSidebarMobile);
}
init();
})();
